name: workflow.yml

on: [push]


permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          WITH_V: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: master
          PRERELEASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_SUFFIX: "beta-${{ github.ref_name }}"
